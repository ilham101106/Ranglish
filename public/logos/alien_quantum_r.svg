<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#120e2e" />
      <stop offset="50%" stop-color="#070614" />
      <stop offset="100%" stop-color="#020108" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="hyperGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="28" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="monolithStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2254" />
      <stop offset="35%" stop-color="#181336" />
      <stop offset="100%" stop-color="#0c0a1f" />
    </linearGradient>

    <linearGradient id="cyberEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f7ff" />
      <stop offset="50%" stop-color="#5842f5" />
      <stop offset="100%" stop-color="#b83bfe" />
    </linearGradient>

    <linearGradient id="crystalShard1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5842f5" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#00f2fe" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="crystalShard2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="accDisk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff00ea" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="70%" stop-color="#7c3aed" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff00ea" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background Base (Circle/Squircle ready) -->
  <rect width="1000" height="1000" rx="220" fill="url(#bgGrad)" />

  <!-- Ambient Outer Tech Rings -->
  <circle cx="500" cy="500" r="440" fill="none" stroke="#5842f5" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 16" />
  <circle cx="500" cy="500" r="410" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.2" />

  <!-- ============================================== -->
  <!-- 1. STEM UTAMA HURUF "R" (OBSIDIAN MONOLITH)     -->
  <!-- ============================================== -->
  <path d="M 210,190 L 360,190 L 360,820 L 210,820 Z" fill="#060512" opacity="0.9" />
  <path d="M 220,180 L 350,180 L 350,810 L 220,810 Z" fill="url(#monolithStem)" stroke="#3b2d75" stroke-width="2" />
  
  <!-- Neural Conduit Spine -->
  <path d="M 245,210 L 265,210 L 265,780 L 245,780 Z" fill="#08071a" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.6" />
  <line x1="255" y1="210" x2="255" y2="780" stroke="#00f2fe" stroke-width="3.5" filter="url(#subtleGlow)" />
  
  <!-- Neural Nodes -->
  <circle cx="255" cy="260" r="5" fill="#ffffff" filter="url(#subtleGlow)" />
  <circle cx="255" cy="400" r="4" fill="#00f2fe" />
  <circle cx="255" cy="540" r="6" fill="#ff00ea" filter="url(#subtleGlow)" />
  <circle cx="255" cy="680" r="4" fill="#00f2fe" />

  <!-- Cybernetic Circuit Traces -->
  <path d="M 290,240 L 320,240 L 335,255 L 335,320" fill="none" stroke="#7952ff" stroke-width="2" opacity="0.7" />
  <circle cx="335" cy="320" r="3.5" fill="#00f2fe" />
  <path d="M 290,620 L 330,620 L 330,700 L 305,725" fill="none" stroke="#7952ff" stroke-width="2" opacity="0.7" />
  <circle cx="305" cy="725" r="3.5" fill="#ff00ea" />

  <!-- ============================================== -->
  <!-- 2. LENGKUNGAN ATAS HURUF "R" (EVENT HORIZON)   -->
  <!-- ============================================== -->
  <path d="M 350,180 
           L 570,180 
           C 740,180 820,260 820,380 
           C 820,500 730,560 560,560 
           L 350,560 Z" 
        fill="url(#monolithStem)" 
        stroke="url(#cyberEdge)" 
        stroke-width="3" />

  <!-- Outer Luminescence Edge -->
  <path d="M 350,188 L 565,188 C 730,188 805,265 805,380 C 805,492 720,552 555,552 L 350,552" 
        fill="none" 
        stroke="url(#cyberEdge)" 
        stroke-width="2.5" 
        filter="url(#subtleGlow)" 
        opacity="0.9" />

  <!-- Inner Loop Cutout / Cosmic Void Chamber -->
  <path d="M 350,275 
           L 520,275 
           C 620,275 665,315 665,370 
           C 665,425 620,465 520,465 
           L 350,465 Z" 
        fill="#04020a" 
        stroke="#5842f5" 
        stroke-width="4" />

  <!-- ==================================================== -->
  <!-- 🌟 DI LUAR NALAR: MINIATURE BLACK HOLE SINGULARITY   -->
  <!-- Tepat di tengah lubang loop huruf R                  -->
  <!-- ==================================================== -->
  <g transform="translate(505, 370)">
    <!-- Accretion Disk / Gravitational Lensing -->
    <ellipse cx="0" cy="0" rx="95" ry="32" fill="none" stroke="url(#accDisk)" stroke-width="6" transform="rotate(-25)" filter="url(#hyperGlow)" />
    <ellipse cx="0" cy="0" rx="105" ry="24" fill="none" stroke="#00f2fe" stroke-width="2" transform="rotate(-25)" opacity="0.8" />
    
    <!-- Relativistic Polar Jets -->
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#ffffff" stroke-width="2" filter="url(#hyperGlow)" transform="rotate(65)" />
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#00f2fe" stroke-width="3.5" filter="url(#subtleGlow)" transform="rotate(65)" />

    <!-- Event Horizon Shadow -->
    <circle cx="0" cy="0" r="32" fill="#000000" stroke="#7952ff" stroke-width="3" />
    <circle cx="0" cy="0" r="28" fill="#000000" />
    
    <!-- Quantum AI Heart (The Core of Intelligence) -->
    <circle cx="0" cy="0" r="10" fill="#ffffff" filter="url(#hyperGlow)" />
    <circle cx="0" cy="0" r="5" fill="#00f2fe" />

    <!-- Orbiting Knowledge Quarks -->
    <circle cx="45" cy="-22" r="3" fill="#ff00ea" filter="url(#subtleGlow)" />
    <circle cx="-50" cy="20" r="2.5" fill="#00f2fe" filter="url(#subtleGlow)" />
    <circle cx="-25" cy="-35" r="2" fill="#ffd000" />
    <circle cx="35" cy="30" r="2" fill="#ffffff" />
  </g>

  <!-- ==================================================== -->
  <!-- 3. KAKI DIAGONAL HURUF "R" (4D CRYSTAL SHARDS)       -->
  <!-- Terbelah menjadi prisma kristal ruang-waktu melayang -->
  <!-- ==================================================== -->
  
  <!-- Shard 1: Root Anchor of the Leg -->
  <polygon points="460,530 570,530 635,615 525,615" 
           fill="url(#crystalShard1)" 
           stroke="#ffffff" 
           stroke-width="1.5" 
           filter="url(#subtleGlow)" />
  <polygon points="460,530 570,530 635,615 525,615" 
           fill="none" 
           stroke="#00f2fe" 
           stroke-width="2" />

  <!-- Shard 2: Mid-Leg Floating Prism (Quantum Gap) -->
  <polygon points="545,635 655,635 725,725 615,725" 
           fill="url(#crystalShard2)" 
           stroke="#ffffff" 
           stroke-width="2" 
           filter="url(#subtleGlow)" />
  <polygon points="545,635 655,635 725,725 615,725" 
           fill="none" 
           stroke="#ff00ea" 
           stroke-width="2.5" />

  <!-- Shard 3: Terminal Foot (Spacetime Strike) -->
  <polygon points="635,745 745,745 835,845 725,845" 
           fill="url(#crystalShard1)" 
           stroke="#ffffff" 
           stroke-width="2.5" 
           filter="url(#hyperGlow)" />
  <polygon points="635,745 745,745 835,845 725,845" 
           fill="#0c0924" 
           opacity="0.4" />

  <!-- Quantum Energy Arcs bridging floating shards -->
  <path d="M 580,615 Q 590,625 600,635" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#subtleGlow)" />
  <path d="M 670,725 Q 685,735 695,745" fill="none" stroke="#ff00ea" stroke-width="3" filter="url(#subtleGlow)" />

  <!-- Four-Point Cosmic Spark Stars -->
  <g transform="translate(835, 845)">
    <path d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="#ffffff" filter="url(#hyperGlow)" />
  </g>
  <g transform="translate(635, 615)">
    <path d="M 0,-12 Q 0,0 12,0 Q 0,0 0,12 Q 0,0 -12,0 Q 0,0 0,-12 Z" fill="#00f2fe" filter="url(#subtleGlow)" />
  </g>
  <g transform="translate(350, 180)">
    <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#7952ff" filter="url(#subtleGlow)" />
  </g>

  <!-- Futuristic Tech Markings -->
  <text x="290" y="785" fill="#00f2fe" font-family="monospace" font-size="13" letter-spacing="3" opacity="0.6">RANGLISH.AI // 0x4E</text>
  <text x="590" y="215" fill="#ff00ea" font-family="monospace" font-size="11" letter-spacing="4" opacity="0.5">SYNAPSE-v2.5</text>
</svg>
