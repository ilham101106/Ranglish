<!doctype html>
<html lang="id" data-theme="standar">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ranglish — Jago Inggris ala Anak Rantau</title>
    <meta name="description" content="Ranglish membantu kamu belajar bahasa Inggris dari lirik lagu, film, & sosmed dengan penjelasan santai ala anak rantau." />
    <!-- Anti-Flash Theme Initializer -->
    <script>
      (function() {
        try {
          var settings = JSON.parse(localStorage.getItem('ranglish_settings') || '{}');
          var theme = settings.theme || 'standar';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'standar');
        }
      })();
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  </head>
  <body class="min-h-screen font-sans antialiased selection:bg-[#5842f5] selection:text-white pb-24 md:pb-0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
